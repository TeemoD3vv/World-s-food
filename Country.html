    <style>
*{
    margin: 0;
    padding: 0;
    text-decoration: none;
    box-sizing: border-box;
    font-family: Cursive;
}
body{
    background-image: linear-gradient(rgba(0, 0, 0, 0.75),rgba(0, 0, 0, 0.75)), url('./pics/Travell.jpeg');
    background-size: cover;
}
.center{
    position: absolute;
    top: 5.40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    color: rgb(155, 121, 28);
}
h1{
    text-align: center;
    font: italic 345% "Fira Sans", serif
}
.navbar{
    width: 50%;
    padding: 35px 31px;
    display: flex;
    align-items: left;
    justify-content: space-between;
}
header{
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: bottom;
}
.navbar ul li{
    list-style: none;
    display: inline-block;
    margin: 0 20px;
    position: relative;
}
.navbar ul li a{
    text-decoration: none;
    color: rgb(155, 121, 28);
    text-transform: uppercase;
}
.navbar ul li::after{
    content: '';
    height: 3px;
    width: 0;
    background: #009688;
    position: absolute;
    left: 0;
    bottom: -10px;
    transition: 0.5s;
}
.navbar ul li:hover::after{
    width: 100%;
}
.Img{
    height: 98%;
    width: 9%;
    margin-left: 1%;
    margin-top:1%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    float: left;
}
.col{
    flex: 33.33%;
    padding: 35px;
}
.container {
    max-width: 1100px;
    margin: auto;
    background: linear-gradient();
    overflow: auto;
}
.gallery {
    margin: 20px;
    border: 3px solid rgb(255, 255, 255);
    float: left;
    width: 460px;
}
.gallery img{
    width: 100%;
    height: 600px;
}
.desc{
    padding: 50;
    text-align: center;
    color: antiquewhite;
}
footer{
    background: #bd7811;
    padding: 10px 0%;
}
footer p{
    color: black;
    text-align: center;
}
    </style>
